version: '3.8'

services:
  freepbx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freepbx17
    hostname: freepbx
    privileged: true
    ports:
      - "80:80"
      - "443:443"
      - "5060:5060/udp"
      - "5160:5160/udp"
      - "18000-18100:18000-18100/udp"
    volumes:
      - freepbx_www:/var/www/html
      - freepbx_etc:/etc/asterisk
      - mysql_data:/var/lib/mysql
    tty: true
    stdin_open: true
    security_opt:
      - seccomp:unconfined
    command: ["/sbin/init"]  # Optional: only if using systemd

volumes:
  freepbx_www:
  freepbx_etc:
  mysql_data:

